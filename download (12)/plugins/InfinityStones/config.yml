# INFINITY STONE CRATE
# /stonecrate charges the player and rolls one random Infinity Stone.
# Requires Vault + an economy provider (for example EssentialsX Economy).
stone-crate:
  enabled: true
  price: 500000.0
  animation-rolls: 20
  animation-interval-ticks: 4
  gui-title: '&5&lCrate das Joias do Infinito'
  broadcast-win: false
  weights:
    power: 1.0
    space: 1.0
    reality: 1.0
    soul: 1.0
    time: 1.0
    mind: 1.0
  messages:
    no-economy: '&cA economia da crate está indisponível. Contacta um administrador.'
    disabled: '&cA crate das Joias do Infinito está desativada.'
    insufficient-funds: '&cPrecisas de &6100.000$ &cpara abrir uma crate das Joias do Infinito.'
    paid: '&7Pagaste &6100.000$ &7para abrir uma crate das Joias do Infinito...'
    already-rolling: '&cJá tens um sorteio de crate em andamento.'
    won: '&aGanhaste: %stone%&a!'
    broadcast: '&6%player% &7abriu uma Crate das Joias do Infinito e ganhou %stone%&7!'
