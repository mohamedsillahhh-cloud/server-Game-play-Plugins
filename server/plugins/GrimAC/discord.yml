# ===========================================================================
#  Discord webhook do GrimAC
#
#  Todos os alertas registados localmente (consola + server logs + /grim history)
#  sao tambem postados NESTE canal do Discord, em tempo real, com um embed.
#
#  Mudar o URL? As definicoes do canal: Definicoes > Integracoes > Webhooks > copiar URL.
#  O webhook atual foi criado para o canal dedicado de anti-cheat do servidor.
# ===========================================================================

# Liga/desliga os envios para o Discord
enabled: true

# URL do webhook do canal de anti-cheat
webhook: "https://discord.com/api/webhooks/1546195156422631576/0ftiFzhziQ8kjHN8OSm7lWgKPsKd3FRtH0vTPi4riHhlae6ptqPdN8utzBE9f-VH7kpk"

# Manter false (validacao normal do formato do Discord).
# So preciso de true se usares um proxy/Matrix forwarder.
disable-webhook-validation: false

# Titulo do embed (aceita markdown do Discord)
embed-title: "**Alerta Anti-Cheat - Survival Progression**"

# Cor do embed (formato HEX). Vermelho = violacao de anti-cheat.
embed-color: "#ED4245"

# Adiciona um rodape com a data/hora do evento
include-timestamp: true

# Substitui backticks em valores (ex.: brand) para nao quebrar a formatacao do Discord
backtick-replacement-char: "`"

# Conteudo do embed de violacao -- placeholders validos:
#   %player%  %check%  %violations%  %version%  %brand%  %ping%  %tps%
violation-content:
    - "━━━━━━━━━━━━━━━━━━━━━━"
    - "**Jogador:** `%player%`"
    - "**Check:** `%check%`"
    - "**Violacoes:** `%violations%`"
    - "━━━━━━━━━━━━━━━━━━━━━━"
    - "**Versao do cliente:** `%version%`"
    - "**Brand:** `%brand%`"
    - "**Ping:** `%ping%ms`"
    - "**TPS:** `%tps%`"

# Schema markers -- ver cabecalho do config.yml
config-flavor: V2
config-version: 1