# %check_name% - nome do check
# %description% - descricao do check
# %vl% - violacoes
# %verbose% - informacao extra
# %player% - nome do jogador
# [alert] - comando especial: aviso em chat para quem tem grim.alerts (warn)
# [log] - comando especial: regista a violacao na base de dados (/grim history)
# [webhook] - comando especial: envia o embed para o Discord (discord.yml)
# [proxy] - comando especial: envia o alerta para servidores do proxy
#
# TUDO fica registado em 3 sitios ao mesmo tempo:
#   1) Consola/server logs (config.yml: alerts.print-to-console = true)
#   2) Base de dados sqlite -> /grim history <player> (comando [log] a cada flag)
#   3) Discord (comando [webhook] nas violacoes relevantes)
#
# Formato das linhas: "Threshold:Interval Task"
#   Threshold = violacoes ativas; Interval = repetir a cada N (0 = so uma vez).

Punishments:
  Simulation:
    # Apos quantos segundos uma violacao e removida?
    remove-violations-after: 300
    # Secao que casa todos os checks de movimento
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "25:25 [webhook]"
      - "150:75 kick %player% &cMovimentos anómalos detectados (anti-cheat)."
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "60:30 kick %player% &cKnockback anómalo detectado (anti-cheat)."
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "80:40 kick %player% &cPacotes fora de sequência detectados (anti-cheat)."
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "80:40 kick %player% &cPacotes anómalos detectados (anti-cheat)."
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:1 [webhook]"
      - "20:10 kick %player% &cAlcance anómalo detectado (anti-cheat)."
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "30:15 kick %player% &cHitbox anómala detectada (anti-cheat)."
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "10:5 [alert]"
      - "1:1 [log]"
      - "10:5 [webhook]"
      - "150:50 kick %player% &cComportamento anómalo detectado (anti-cheat)."
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
      - "5:5 [webhook]"
      - "40:20 kick %player% &cComportamento de combate anómalo detectado (anti-cheat)."
  # Autoclicker ainda nao existe em 2.2.10+; grupo reservado para o futuro.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
      - "10:10 [webhook]"
      - "50:25 kick %player% &cAutoclick detectado (anti-cheat)."