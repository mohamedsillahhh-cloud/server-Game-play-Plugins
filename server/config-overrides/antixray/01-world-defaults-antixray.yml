# =============================================================================
#  Anti-Xray - OVERWORLD (engine-mode 2)
#  LOCAL: colar em  config/paper-world-defaults.yml
#  Substitui o bloco anticheat.anti-xray existente. Requer RESTART (sem /reload).
# =============================================================================
anticheat:
  anti-xray:
    enabled: true
    engine-mode: 2
    hidden-blocks:
      # Option: 'air' pode ser adicionado para esconder minérios expostos em
      # cavernas, mas causa quedas de FPS em alguns clientes. (deixado de fora)
      - copper_ore
      - deepslate_copper_ore
      - raw_copper_block
      - diamond_ore
      - deepslate_diamond_ore
      - gold_ore
      - deepslate_gold_ore
      - iron_ore
      - deepslate_iron_ore
      - raw_iron_block
      - lapis_ore
      - deepslate_lapis_ore
      - redstone_ore
      - deepslate_redstone_ore
    lava-obscures: false
    # Ajusta ao teu gosto (alguns minérios geram-se bem acima de y=64).
    max-block-height: 64
    replacement-blocks:
      - chest
      - amethyst_block
      - andesite
      - budding_amethyst
      - calcite
      - coal_ore
      - deepslate_coal_ore
      - deepslate
      - diorite
      - dirt
      - emerald_ore
      - deepslate_emerald_ore
      - granite
      - gravel
      - oak_planks
      - smooth_basalt
      - stone
      - tuff
    update-radius: 2
    use-permission: false